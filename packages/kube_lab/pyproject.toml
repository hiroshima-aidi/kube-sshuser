[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kube-lab"
version = "0.3.0"
description = "User-side CLI for running your own dev pods on the lab Kubernetes cluster"
requires-python = ">=3.9"
dependencies = [
	"PyYAML>=6.0",
]

[project.scripts]
kube-lab = "kube_lab.lab_cli:main"
# Renamed from gpu-dev in 0.3.0. Both names run the same main(); invoking the old
# one prints a one-line notice. Remove after one semester of overlap.
gpu-dev = "kube_lab.lab_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]