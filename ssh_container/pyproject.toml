[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-tool"
version = "0.2.0"
description = "User-side tools for GPU dev pods and jobs"
requires-python = ">=3.9"
dependencies = [
	"PyYAML>=6.0",
]

[project.scripts]
gpu-dev = "ssh_tool.gpu_dev:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]